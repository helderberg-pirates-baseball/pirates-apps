name: Checks

# Runs on every pull request, and on main after a merge, so a broken change
# shows up before it's merged (or straight after)
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that's still going
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version in package.json's "packageManager", and
      # caches downloaded packages between runs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Fails if pnpm-lock.yaml doesn't match the package.json files
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Bookings app tests
        run: pnpm test:bookings

      - name: Bookings app type check
        run: pnpm check:bookings

      # Building pre-renders the public pages (privacy, offline), which loads
      # the sign-in code, and Astro checks the Google settings exist. The
      # build never talks to Google, so placeholders are enough: no secrets
      # in CI. Netlify's builds use the real values.
      - name: Bookings app build
        run: pnpm build:bookings
        env:
          GOOGLE_CLIENT_ID: ci-not-a-real-value
          GOOGLE_CLIENT_SECRET: ci-not-a-real-value
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ci-not-a-real-value
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-not-a-real-value
          SPREADSHEET_ID: ci-not-a-real-value

      - name: Website v2 build
        run: pnpm build
